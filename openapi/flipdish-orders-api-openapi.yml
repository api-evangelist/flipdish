components:
  schemas:
    Reject:
      description: Reject
      required:
      - RejectReason
      type: object
      properties:
        RejectReason:
          description: Reject reason.
          enum:
          - TooBusy
          - FoodUnavailable
          - UnableToDeliver
          - UnknownAddress
          - UnknownReason
          - TooSoon
          - TimeUnavailable
          - DontDeliverToArea
          - StoreUncontactable
          type: string
        DoNotNotifyCustomer:
          description: Notify customer. The server will not send and SMS to the customer if the value is true.
          type: boolean
      example:
        RejectReason: 0
        DoNotNotifyCustomer: false
    OrderList:
      description: A list of orders.
      type: object
      properties:
        Orders:
          description: A list of orders.
          type: array
          items:
            $ref: '#/components/schemas/OrderReference'
    RestApiResult_OrderFulfillmentStatus:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/OrderFulfillmentStatus'
          description: Generic data object.
    OrderItemOption:
      description: Order item option
      type: object
      properties:
        Metadata:
          description: Metadata
          type: object
          additionalProperties:
            type: string
        MenuItemOptionPublicId:
          format: uuid
          description: Public id of the Menu Item Option
          type: string
          example: 00000000-0000-0000-0000-000000000000
        MenuItemOptionId:
          format: int32
          description: Menu item option identifier
          type: integer
        IsMasterOptionSetItem:
          description: Is master option set item
          type: boolean
        Name:
          description: Name
          type: string
        Price:
          format: double
          description: Price
          type: number
        TaxAmount:
          format: double
          description: Tax currency amount
          type: number
        MenuItemOptionDisplayOrder:
          format: int32
          description: Menu item option display order
          type: integer
        MenuItemOptionSetDisplayOrder:
          format: int32
          description: Menu item option set display order
          type: integer
        DepositReturnFee:
          format: double
          description: Deposit return fee
          type:
          - number
          - 'null'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
