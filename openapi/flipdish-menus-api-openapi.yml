        Late:
          $ref: '#/components/schemas/Range'
          description: Late
        Ranges:
          description: Ranges
          type: array
          items:
            $ref: '#/components/schemas/Range'
        DayOfWeek:
          description: Day of week
          enum:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          type: string
        StartTime:
          description: Start time
          type: string
        Period:
          description: Period
          type: string
        StartTimeEarly:
          description: Start time early
          type: string
        PeriodEarly:
          description: Period early
          type: string
