components:
  schemas:
    UpdateProductReference:
      description: Data to update a {Flipdish.Menus.PublicModels.V1.Catalog.Groups.UpdateProductReference}
      required:
      - CatalogItemId
      - ProductType
      type: object
      properties:
        CatalogItemId:
          description: Identifier of the CatalogItemId to use as SubProduct
          maxLength: 30
          minLength: 0
          type: string
        ProductType:
          description: Type of the SupProduct
          enum:
          - Product
          - Modifier
          type: string
        PreselectedQuantity:
          format: int32
          description: Quantity of the modifier that will be set when the parent product is placed in the basket
          type: integer
    CreateGroup:
      description: Create a Catalog Group
      required:
      - GroupType
      - Sku
      - Name
      type: object
      properties:
        MinSelectCount:
          format: int32
          description: Minimum number of items that the user has to select
          type: integer
        MaxSelectCount:
          format: int32
          description: Maximum number of items that the user has to select
          type:
          - integer
          - 'null'
        Products:
          description: Collection of items associated with this group
          type: array
          items:
            $ref: '#/components/schemas/CreateProductReference'
        Metafields:
          description: Collection of metafields
          type: array
          items:
            $ref: '#/components/schemas/Metafield'
        GroupType:
          description: Type of group (ModifierGroup, etc)
          enum:
          - ModifierGroup
          type: string
        Sku:
          description: Stock Keeping Unit (SKU)
          maxLength: 30
          minLength: 0
          type: string
        Name:
          description: Group name
          maxLength: 300
          minLength: 0
          type: string
        AutogenerateDisplayText:
          description: Autogenerate display text in ordering applications
          type: boolean
        ImageFileName:
          description: Image File Name
          maxLength: 512
          minLength: 0
          type: string
    ProductReference:
      description: Catalog Item associated
      required:
      - CatalogItemId
      - ProductType
      type: object
      properties:
        Item:
          $ref: '#/components/schemas/Product'
          description: Details of the referenced {Flipdish.Menus.PublicModels.V1.Catalog.Groups.ProductReference.Product}
        Product:
          $ref: '#/components/schemas/Product'
          description: Details of the referenced {Flipdish.Menus.PublicModels.V1.Catalog.Groups.ProductReference.Product}
        CatalogItemId:
          description: Identifier of the CatalogItemId to use as SubProduct
          maxLength: 30
          minLength: 0
          type: string
        ProductType:
          description: Type of the SupProduct
          enum:
          - Product
          - Modifier
          type: string
        PreselectedQuantity:
          format: int32
          description: Quantity of the modifier that will be set when the parent product is placed in the basket
          type: integer
    Product:
      description: Product
      required:
      - ProductType
      - Sku
      - Name
      - Price
      type: object
      properties:
        CatalogItemId:
          description: Unique catalog Item id
          maxLength: 30
          minLength: 0
          type: string
        IsArchived:
          description: Returns true if the item is archived
          type: boolean
        Groups:
          description: Collection of groups associated with this item
          type: array
          items:
            $ref: '#/components/schemas/GroupReference'
        Metafields:
          description: Collection of metafields
          type: array
          items:
            $ref: '#/components/schemas/Metafield'
        ProductType:
          description: Type of item (Product, Modifier, etc)
          enum:
          - Product
          - Modifier
          type: string
        Sku:
          description: Stock Keeping Unit (SKU)
          maxLength: 30
          minLength: 0
          type: string
        Name:
          description: Product name
          maxLength: 300
          minLength: 0
          type: string
        Description:
          description: Product description
          maxLength: 3000
          minLength: 0
          type: string
        Price:
          format: double
          description: Product price
          minimum: 0
          type: number
        ImageFileName:
          description: Image File Name
          maxLength: 512
          minLength: 0
          type: string
        Alcohol:
          description: Product contains alcohol
          type: boolean
    GroupReference:
      description: Reference to an existing {Flipdish.Menus.PublicModels.V1.Catalog.Groups.Group}
      required:
      - CatalogItemId
      - GroupType
      type: object
      properties:
        Group:
          $ref: '#/components/schemas/Group'
          description: Details of the referenced {Flipdish.Menus.PublicModels.V1.Catalog.Products.GroupReference.Group}
        CatalogItemId:
          description: Identifier of the ProductId to use as SubProduct
          maxLength: 30
          minLength: 0
          type: string
        GroupType:
          description: Type of the SupProduct
          enum:
          - ModifierGroup
          type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    CreateProductReference:
      description: Information to create a reference to a {Flipdish.Menus.PublicModels.V1.Catalog.Product}
      required:
      - CatalogItemId
      - ProductType
      type: object
      properties:
        CatalogItemId:
          description: Identifier of the CatalogItemId to use as SubProduct
          maxLength: 30
          minLength: 0
          type: string
        ProductType:
          description: Type of the SupProduct
          enum:
          - Product
          - Modifier
          type: string
        PreselectedQuantity:
          format: int32
          description: Quantity of the modifier that will be set when the parent product is placed in the basket
          type: integer
    UpdateGroup:
