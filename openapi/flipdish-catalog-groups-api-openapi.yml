          type: string
        AutogenerateDisplayText:
          description: Autogenerate display text in ordering applications
          type:
          - boolean
          - 'null'
        ImageFileName:
          description: Image File Name
          maxLength: 512
          minLength: 0
          type: string
        MinSelectCount:
          format: int32
          description: Minimum number of items that the user has to select
          type:
          - integer
          - 'null'
        MaxSelectCount:
          format: int32
          description: Maximum number of items that the user has to select
          type:
          - integer
          - 'null'
        Products:
          description: Collection of items associated with this group
          type: array
          items:
            $ref: '#/components/schemas/UpdateProductReference'
        Metafields:
          description: Collection of metafields
          type: array
          items:
            $ref: '#/components/schemas/Metafield'
    Group:
      description: CatalogGroup
      required:
      - GroupType
      - Sku
      - Name
      type: object
      properties:
        CatalogGroupId:
          description: Unique catalog group id
          maxLength: 30
          minLength: 0
          type: string
        CatalogItemId:
          description: Unique catalog item id
          maxLength: 30
          minLength: 0
          type: string
        IsArchived:
          description: Returns true if the group is archived
          type: boolean
        MinSelectCount:
          format: int32
          description: Minimum number of items that the user has to select
          type: integer
        MaxSelectCount:
          format: int32
          description: Maximum number of items that the user has to select
          type:
          - integer
          - 'null'
        Products:
          description: Collection of items associated with this product
          type: array
          items:
            $ref: '#/components/schemas/ProductReference'
        Metafields:
          description: Collection of metafields
          type: array
          items:
            $ref: '#/components/schemas/Metafield'
        GroupType:
          description: Type of group (ModifierGroup, etc)
          enum:
