          text/json:
            schema:
              $ref: '#/components/schemas/StoreAddressForm'
          application/xml:
            schema:
              $ref: '#/components/schemas/StoreAddressForm'
          text/xml:
            schema:
              $ref: '#/components/schemas/StoreAddressForm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreAddressForm'
        required: true
