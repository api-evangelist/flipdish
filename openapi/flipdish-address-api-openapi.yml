                $ref: '#/components/schemas/RestApiResult_CountryFormResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_CountryFormResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_CountryFormResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
