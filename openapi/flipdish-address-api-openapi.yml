      summary: Form by country
      x-summary-source: derived
  /api/v1.0/address/templates:
    post:
      tags:
      - Address
      operationId: AddressTemplates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiStringResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiStringResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiStringResult'
            text/xml:
              schema:
