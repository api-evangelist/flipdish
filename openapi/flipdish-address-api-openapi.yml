components:
  schemas:
    DynamicFormRule:
      type: object
      properties:
        Value:
          type: object
        Message:
          type: string
        Scopes:
          type: string
    StoreAddressForm:
      description: Address form payload.
      required:
      - AddressFields
      - CountryCode
      type: object
      properties:
        AddressFields:
          description: The dynamic fields generated by the address form.
          type: object
          additionalProperties:
            type: object
        CountryCode:
          description: ISO 2 letters code for the country, should be the same as the form that generates the fields.
          type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    RestApiResult_CountryFormResponse:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/CountryFormResponse'
          description: Generic data object.
    GoogleViewport:
      type: object
      properties:
        Northeast:
          $ref: '#/components/schemas/GoogleCoordinates'
        Southwest:
          $ref: '#/components/schemas/GoogleCoordinates'
    GoogleAddress:
      type: object
      properties:
        Results:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAddressResult'
        Result:
          $ref: '#/components/schemas/GoogleAddressResult'
        Status:
          type: string
    RestApiResult_AddressFormResponse:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/AddressFormResponse'
          description: Generic data object.
    AddressFormDisplayFormat:
      type: object
      properties:
        OneLine:
          type: string
        TwoLines:
          type: array
          items:
            type: string
    GoogleCoordinates:
      type: object
      properties:
        Lat:
          format: float
          type: number
        Lng:
          format: float
          type: number
    GoogleAddressComponent:
      type: object
      properties:
        Long_name:
          type: string
        Short_name:
          type: string
        Types:
          type: array
          items:
            type: string
    GoogleGeometry:
      type: object
      properties:
        Location:
          $ref: '#/components/schemas/GoogleLocation'
        Location_type:
          type: string
        Viewport:
          $ref: '#/components/schemas/GoogleViewport'
    AddressFormResponse:
      description: A response of a dyanmic form definition.
      type: object
      properties:
        FormData:
          description: List of field definitions.
          type: array
          items:
            $ref: '#/components/schemas/DynamicFormField'
        CountryCode:
          description: ISO two letter code.
          type: string
        Language:
          description: ISO culture code.
          type: string
        DisplayFormat:
          $ref: '#/components/schemas/AddressFormDisplayFormat'
          description: Templates used to format form fields when displaying items in a list.
    DynamicFormFieldOption:
      type: object
      properties:
        Display:
          type: string
        Value:
          type: string
    GoogleLocation:
      type: object
      properties:
        Lat:
          format: float
          type: number
        Lng:
          format: float
          type: number
    RestApiStringResult:
      description: Rest api string result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Data string
          type: string
    GoogleAddressResult:
      type: object
      properties:
        Address_components:
          type: array
          items:
            $ref: '#/components/schemas/GoogleAddressComponent'
        Formatted_address:
          type: string
        Geometry:
          $ref: '#/components/schemas/GoogleGeometry'
        Place_id:
          type: string
        Types:
          type: array
          items:
            type: string
    CountryFormResponse:
      description: Country
      type: object
      properties:
        Value:
          description: ISO two letter code.
          type: string
        Label:
          description: Label
          type: string
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    DynamicFormRules:
      type: object
      properties:
        MaxLength:
          $ref: '#/components/schemas/DynamicFormRule'
        MinLength:
          $ref: '#/components/schemas/DynamicFormRule'
        Required:
          $ref: '#/components/schemas/DynamicFormRule'
        Pattern:
          $ref: '#/components/schemas/DynamicFormRule'
        Predefined:
          type: array
          items:
            $ref: '#/components/schemas/DynamicFormFieldOption'
    DynamicFormField:
      type: object
      properties:
        Identifier:
          type: string
        Label:
          type: string
        Placeholder:
          type: string
        Rules:
          $ref: '#/components/schemas/DynamicFormRules'
        Mapping:
          type: object
          additionalProperties:
            type: string
        Modifiers:
          type: array
          items:
            type: string
        Value:
          type: object
        Scopes:
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
