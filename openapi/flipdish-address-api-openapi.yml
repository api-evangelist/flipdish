          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
      security:
      - oauth2:
        - api
      summary: Form by app
      x-summary-source: derived
  /api/v1.0/address/country/{countryCode}/form:
    get:
      tags:
      - Address
      operationId: FormByCountry
      parameters:
      - name: countryCode
        in: path
        required: true
        schema:
          type: string
      - name: language
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_AddressFormResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_AddressFormResponse'
            application/xml:
              schema:
