components:
  schemas:
    RestApiFinanceSearchPaginationResult_Invoice:
      description: Rest api finance search pagination result
      required:
      - NextPage
      - Limit
      - TotalRecordCount
      - Data
      type: object
      properties:
        NextPage:
          description: Next page
          type: string
        Limit:
          format: int32
          description: Current page size
          type: integer
        TotalRecordCount:
          format: int32
          description: Total record count
          type: integer
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiFinanceSearchPaginationResult_SubscriptionInvoice:
      description: Rest api finance search pagination result
      required:
      - NextPage
      - Limit
      - TotalRecordCount
      - Data
      type: object
      properties:
        NextPage:
          description: Next page
          type: string
        Limit:
          format: int32
          description: Current page size
          type: integer
        TotalRecordCount:
          format: int32
          description: Total record count
          type: integer
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionInvoice'
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    Invoice:
      description: Represents an ordering invoice for a period of time.
      type: object
      properties:
        InvoiceNumber:
          description: Invoice Number
          type: string
        StartDay:
          format: date-time
          description: The start day of the invoice period.
          type: string
        EndDay:
          format: date-time
          description: The end day of the invoice period.
          type: string
    SubscriptionInvoice:
      description: Invoice
      required:
      - InvoiceId
      - Number
      - Currency
      - Status
      - PdfLink
      - HostedUrl
      - Overdue
      type: object
      properties:
        InvoiceId:
          description: The invoice identifier
          type: string
        Number:
          description: Invoice number
          type: string
        Total:
          format: double
          description: Total
          type: number
        Currency:
          description: Currency
