components:
  schemas:
    RestApiArrayResult_ApmDataPoint:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/ApmDataPoint'
    ApmDataPoint:
      description: A single data point in timeline graphs related to APM
      type: object
      properties:
        PeriodStart:
          format: date-time
          description: Date from which the data point starts
          type: string
        PeriodLengthInDays:
          format: int32
          description: The length in days that this data point covers
          type: integer
        Value:
          format: int32
          description: The value of this data point
          type: integer
    ApmHourlyDataPoint:
      description: Provides an average value for a single hour of day of the week
      type: object
      properties:
        Day:
          description: Day of the week
          enum:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          type: string
        Hour:
          format: int32
          description: Hour in the day
          type: integer
        TotalValue:
          format: int32
          description: Total Value
          type: integer
    ApmStatistics:
      description: APM Statistics
      type: object
      properties:
        EstimatedMinutesSaved:
          format: int32
          description: Total amount of time spent with APM
          type: integer
        EstimatedMinutesCouldSaved:
          format: int32
          description: Total amount of time that could be saved
          type: integer
        CurrencyData:
          description: Currency based data
          type: array
          items:
            $ref: '#/components/schemas/StatisticsCurrencyDataPoint'
    PhoneCall:
      description: Phone call
      type: object
      properties:
        PhoneCallId:
          format: int32
          description: Phone call id
          type: integer
        CallSid:
          description: Twilio Call SID
          type: string
        TimeOfCall:
          format: date-time
          description: Time of the call
          type: string
        TimeOfCallLocal:
          format: date-time
          description: Time of the call, local to the store to which the call was made
          type: string
        StoreId:
          format: int32
          description: ID of the store that the call was TO
          type: integer
        StoreName:
          description: Name of the store that the call was TO
          type: string
        CallerName:
          description: Name of the caller
          type: string
        CallerUserId:
          format: int32
          description: UserID of the caller
          type: integer
        CallerNumber:
          description: Phone number of the caller
          type: string
        CallLengthInSeconds:
          format: int32
          description: The amount of time the call took
          type: integer
        CallStatus:
          description: The status of the call
          enum:
          - Queued
          - Ringing
          - InProgress
          - Completed
          - Failed
          - Busy
          - NoAnswer
          - Unknown
          - Canceled
          type: string
    RestApiArrayResult_ApmCurrencyDataPoint:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/ApmCurrencyDataPoint'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    RestApiArrayResult_ApmHourlyDataPoint:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/ApmHourlyDataPoint'
    CurrencyData:
      description: A single currency data piece, with no date
      type: object
      properties:
