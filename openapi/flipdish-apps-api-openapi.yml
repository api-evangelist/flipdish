components:
  schemas:
    DnsRecordInformation:
      description: Holds the information for the A and CNAME Records of a domain.
      type: object
      properties:
        IsCNameReady:
          description: indicates whether the CNAME record is ready or not.
          type: boolean
        IsAReady:
          description: indicates whether the A record is ready or not.
          type: boolean
        IsApiCNameReady:
          description: indicates whether the API CNAME record is ready or not.
          type: boolean
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    RestApiPaginationResult_App:
      description: Rest api pagination result
      required:
      - Page
      - Limit
      - TotalRecordCount
      - Data
      type: object
      properties:
        Page:
          format: int32
          description: Current page index
          type: integer
        Limit:
          format: int32
          description: Current page size
          type: integer
        TotalRecordCount:
          format: int32
          description: Total record count
          type: integer
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/App'
    RestApiResult_DnsRecordInformation:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/DnsRecordInformation'
          description: Generic data object.
    RestApiArrayResult_SupportedCountry:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/SupportedCountry'
    AppCompliance:
      description: Application compliance model
      type: object
      properties:
        AppId:
          description: App ID
          type: string
        ComplianceType:
          description: "Type of compliance.\nThis controls if the Flipdish websites and apps display cookie consent banners and adjust cookies to be inline with various regulations. \nYou should set this correctly based on your region."
          enum:
          - Default
          - GdprCompliance
          type: string
        AllowDisablingOfGdpr:
          description: For EU countries, we should not allow to change the option to “Default banner”, but all other countries should be able to do so.
          type: boolean
    CreateAppParameters:
      description: The parameters required to create a new app.
      type: object
      properties:
        Name:
          description: The name of the brand that this app/white-label represents.
          type: string
    Coordinates:
      description: Coordinates
      type: object
      properties:
        Latitude:
          format: double
          description: Latitude
          type: number
        Longitude:
          format: double
          description: Longitude
          type: number
    Language:
      description: Sorted Language
      type: object
      properties:
        LanguageId:
          description: ISO 639-1 Language Code
          type: string
        DisplayOrder:
          format: int32
          description: Display Order
          type: integer
        Name:
          description: Language Name
          type: string
        Enabled:
          description: Is the language enabled for use.
          type: boolean
    RestApiResult_App:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/App'
          description: Generic data object.
    SupportedCountry:
      description: Describes a supported country
      type: object
      properties:
        CountryCode:
          description: Country code
          type: string
        Name:
          description: Nice display name for a country
          type: string
        PhoneCode:
          format: int32
          description: Country internatinoal phone code prefix
          type: integer
        LanguageCode:
          description: Language code
          type: string
        LanguageName:
          description: Language name
          type: string
        OtpNumber:
          description: The phone number provided to Store staff which, in conjunction with a one-time-code, will connect them to the customer.
          type: string
        SupportNumber:
          description: The store's support phone number, displayed to customers.
          type: string
        AddressLayout:
          description: Address layout format. This changes the layout of address entry forms on the web app, iOS and Android app and should be set based on local custom.
          enum:
          - BuildingFirst
          - AddressFirst
          - FullStreetAddressFirst
          type: string
        PostCodeType:
          description: Post code type
          enum:
          - None
          - PostCode
          - Zip
          type: string
        SupportRegion:
          description: Supported region. This is not used.
          enum:
          - Default
          - Spain
          - Benelux
          type: string
    RestApiStringResult:
      description: Rest api string result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Data string
          type: string
    RestApiResult_AppCompliance:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/AppCompliance'
          description: Generic data object.
    AppLookup:
      description: App lookup model
      type: object
      properties:
        AppId:
          description: App id
          type: string
    ValidationErrorResult:
      description: Validation error result
