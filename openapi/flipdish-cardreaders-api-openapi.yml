components:
  schemas:
    RestApiResult_CardReader:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/CardReader'
          description: Generic data object.
    StripeTerminalConnectionToken:
      description: Stripe Terminal Connection Token
      type: object
      properties:
        Token:
          description: Connection Token
          type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    UnRegisterCardReaderRequest:
      description: Un-Register card reader request
      required:
      - ReaderId
      - KioskDeviceId
      type: object
      properties:
        ReaderId:
          description: Device card readerid
          type: string
        KioskDeviceId:
          description: The kiosk device id
          type: string
    RestApiResult_BluetoothTerminalStatus:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/BluetoothTerminalStatus'
          description: Generic data object.
    StripeTerminalLocation:
      description: Stripe Terminal Private Key
      type: object
      properties:
        Location:
          description: Registered location of the terminal
          type: string
    BluetoothTerminalStatus:
      description: Status of the bluetooth terminal
      type: object
      properties:
        SerialNumber:
          description: Serial Number
          type: string
        SoftwareVersion:
          description: Software Version
          type: string
        DeviceType:
          description: Device Type
          enum:
          - CHIPPER_2X
          - COTS_DEVICE
          - VERIFONE_P400
          - WISEPAD_3
          - WISEPOS_E
          type: string
        Status:
          description: Device Status
          enum:
          - Not_Connected
          - Connecting
          - Connected
          - Online
          - Offline
          type: string
        BatteryLevel:
          format: float
          description: Indication of the battery level from 0 to 1
          type:
          - number
          - 'null'
        UpdateTime:
          format: date-time
          description: Last time the status was updated
          type: string
        ReaderId:
          description: ReaderId for Stripe Terminal
          type: string
    RestApiResult_StripeTerminalConnectionToken:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/StripeTerminalConnectionToken'
          description: Generic data object.
    CardReaderRegistrationRequest:
      description: Card reader registration request
      required:
      - RegistrationCode
      type: object
      properties:
        RegistrationCode:
          description: The reader registration code
          type: string
        KioskDeviceId:
          description: The kiosk device id
          type: string
    ProcessPaymentIntentRequest:
      description: Initiate card reader Payment process request
      required:
      - PaymentIntentId
      type: object
      properties:
        PaymentIntentId:
          description: Device card paymentIntentId
          type: string
    ReaderActionStateInfo:
      description: Card reader state information
      type: object
      properties:
        ActionState:
          description: Action state
          type: string
        FailureCode:
          description: Failure code
          type: string
        FailureMessage:
          description: Failure Message
          type: string
        Type:
          description: Type
          type: string
    KioskStripeLocation:
      description: Stripe Terminal location used by a kiosk's card readers
      type: object
      properties:
        DeviceId:
          description: Kiosk device ID
          type: string
        StripeLocationId:
          description: Stripe Terminal location ID. Null when card payments have not been set up on the kiosk.
          type: string
    RestApiResult_StripeTerminalLocation:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/StripeTerminalLocation'
          description: Generic data object.
    RestApiResult_KioskStripeLocation:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/KioskStripeLocation'
          description: Generic data object.
    CardReader:
      description: Card reader
      type: object
      properties:
        Id:
          description: Stripe reader id
          type: string
        DeviceSoftwareVersion:
          description: Software version
          type: string
        SerialNumber:
          description: Device serial number
          type: string
        Status:
          description: Device status online or offline
          type: string
        RegistrationCode:
          description: Registration code
          type: string
        DeviceType:
          description: Device type
          type: string
        Deleted:
          description: Indicates that the reader is deleted or not
          type:
          - boolean
          - 'null'
        Action:
          $ref: '#/components/schemas/ReaderActionStateInfo'
          description: Action status
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    GeoPointRequest:
      description: Terminal location request
      type: object
      properties:
        Latitude:
          format: double
          description: Kiosk device latitude
          type: number
        Longitude:
          format: double
          description: Kiosk device longitude
          type: number
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
