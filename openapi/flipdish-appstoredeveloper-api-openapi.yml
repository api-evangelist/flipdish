components:
  schemas:
    ValidValue:
      required:
      - Code
      - Name
      type: object
      properties:
        Code:
          type: string
        Name:
          type: string
    AppStoreApp:
      required:
      - Id
      - VerificationStatus
      - OAuthAppId
      - Internal
      - Details
      - ConfigurationType
      - StoreSelectorType
      - PermissionsType
      - Name
      - Description
      - Categories
      - Countries
      type: object
      properties:
        Id:
          type: string
        VerificationStatus:
          enum:
          - Draft
          - Submitted
          - Verified
          type: string
        Logo:
          type: string
        OAuthAppId:
          type: string
        Internal:
          type: boolean
        Details:
          type: string
        ConfigurationType:
          enum:
          - ExternalLink
          - FlipdishHosted
          type: string
        StoreSelectorType:
          enum:
          - None
          - Single
          - Multiple
          type: string
        FieldGroups:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroup'
        SetupInstructions:
          type: string
        ExternalSetupLink:
          type: string
        TeammateAppAccessLevel:
          enum:
          - Owner
          - StoreOwner
          - PropertyOwner
          - ManagedOwner
          - Integrator
          - PropertyManager
          - StoreManager
          - StoreStaff
          - StaffMember
          - StoreReadOnlyAccess
          - FinanceManger
          type: string
        PermissionsType:
          enum:
          - Teammate
          type: string
        Support:
          $ref: '#/components/schemas/AppStoreAppSupportInfo'
        ExternalFunctionActionUrl:
          type: string
        ExternalFunctionSignatureKey:
          type: string
        IsPaid:
          type: boolean
        Name:
          type: string
        Description:
          type: string
        IsEnabled:
          type: boolean
        Categories:
          type: array
          items:
            enum:
            - PointOfSale
            - DeliveryAndLogistics
            - CRM
            - GiftCard
            - Accounting
            - LoyaltyAndMarketing
            - Other
            type: string
        Countries:
          type: array
          items:
            enum:
            - GB
            - IE
            - FR
            - ES
            - PT
            - IT
            - DE
            - PL
            - BE
            - LU
            - NL
            - US
            - CA
            - BG
            - MX
            - AU
            - NZ
            type: string
        DeveloperName:
          type: string
    UpdateAppStoreAppExternalProduct:
      type: object
      properties:
        ExternalProductId:
          type: string
    RestApiResult_AppStoreApp:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/AppStoreApp'
          description: Generic data object.
    Field:
      required:
      - Name
      - Description
      - Key
      - Position
      - FieldType
      type: object
      properties:
        Name:
          type: string
        Description:
          type: string
        Key:
          type: string
        Tooltip:
          type: string
        Position:
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        DefaultValue:
          type: string
        ValidValues:
          type: array
          items:
            $ref: '#/components/schemas/ValidValue'
        ValidationRegex:
          type: string
        FieldType:
          enum:
          - Text
          - TextArea
          - Integer
          - Decimal
          - Date
          - DateTime
          - Time
          - Select
          - Boolean
          - ActionButton
          type: string
        IsFlipdishRestricted:
          type:
          - boolean
          - 'null'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
