components:
  schemas:
    JobPricing:
      description: Job Pricing
      type: object
      properties:
        Currency:
          description: Currency
          type: string
        TaxPercentage:
          format: double
          description: Tax Percentage
          type:
          - number
          - 'null'
        PriceTaxIncluded:
          format: double
          description: Price Tax Included
          type:
          - number
          - 'null'
        PriceTaxExcluded:
          format: double
          description: Price Tax Excluded
          type:
          - number
          - 'null'
        TaxAmount:
          format: double
          description: Tax Amount
          type:
          - number
          - 'null'
        InvoiceUrl:
          description: Invoice Url
          type: string
    JobDriver:
      description: Job Driver
      type: object
      properties:
        Id:
          format: int32
          description: Id
          type: integer
        DisplayName:
          description: Display Name
          type: string
        Phone:
          description: Phone
          type: string
        PictureUrl:
          description: Picture Url
          type: string
        TransportType:
          description: Transport Type
          type: string
        Latitude:
          format: double
          description: Latitude
          type:
          - number
          - 'null'
        Longitude:
          format: double
          description: Longitude
          type:
          - number
          - 'null'
    RestApiResult_JobResponse:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/JobResponse'
          description: Generic data object.
    JobDeliveryDetail:
      description: Job Delivery Detail
      type: object
      properties:
        Id:
          format: int32
          description: Id
          type: integer
        Latitude:
          format: double
          description: Latitude
          type:
          - number
          - 'null'
        Longitude:
          format: double
          description: Longitude
          type:
          - number
          - 'null'
        Comment:
          description: Comment
          type: string
        Address:
          $ref: '#/components/schemas/JobAddress'
          description: Address
        Contact:
          $ref: '#/components/schemas/JobContact'
          description: Contact
    JobAddress:
      description: Job Address
      type: object
      properties:
        Street:
          description: Street
          type: string
        Postcode:
          description: Postcode
          type: string
        City:
          description: City
          type: string
        Country:
          description: Country
          type: string
        Zone:
          description: Zone
          type: string
        FormattedAddress:
          description: Formatted Address
          type: string
    JobDelivery:
      description: Job Delivery
      type: object
      properties:
        Id:
          format: int32
          description: Id
          type: integer
        Status:
          description: Status
          type: string
        PickedAt:
          description: Picked At
          type: string
        DeliveredAt:
          description: Delivered At
          type: string
        TrackingUrl:
          description: Tracking Url
          type: string
        ClientReference:
          description: Client Reference
          type: string
        PackageDescription:
          description: Package Description
          type: string
        PackageType:
          description: Package Type
          type: string
        Pickup:
          $ref: '#/components/schemas/JobDeliveryDetail'
          description: Pickup
        Dropoff:
          $ref: '#/components/schemas/JobDeliveryDetail'
          description: Dropoff
        Eta:
          $ref: '#/components/schemas/JobEta'
          description: Eta
        Cancellation:
          $ref: '#/components/schemas/JobCancellation'
          description: Cancellation
        Proof:
          $ref: '#/components/schemas/JobProof'
          description: Proof
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    StuartSettings:
      description: Stuart settings
      type: object
      properties:
        ClientId:
          description: Client Id
          type: string
        ClientSecret:
          description: Client Secret
          type: string
        Enabled:
          description: Enabled
          type: boolean
        WebhookUrlBasicAuthentication:
          description: Webhook url to settle in the Stuart portal
          type: string
        OverrideWebhookUrl:
          description: Override Flipdish Webhook Url
          type: boolean
        MinutesToPickupBeforeThanDeliveryTime:
          format: int32
          description: MinutesToPickupBeforeThanDeliveryTime
          type:
          - integer
          - 'null'
        PackageType:
          description: Package type
          enum:
          - Xsmall
          - Small
          - Medium
          - Large
          - Xlarge
          type:
          - string
          - 'null'
        TransportType:
          description: Transport type
          enum:
          - Bike
          - Cargobike
          - Cargobikexl
          - Motorbike
          - Motorbikexl
          - Car
          - Van
          type:
          - string
          - 'null'
        CancelOrderIfStuartCancelDelivery:
          description: Determines if Flipdish order should be cancel when Stuart cancels delivery
          type: boolean
        TransportPrices:
          description: If the order exceeds are certain amount this configuration will determine a new vehicle type
          type: object
          properties:
            Bike:
              format: double
              type: number
            Cargobike:
              format: double
              type: number
            Cargobikexl:
              format: double
              type: number
            Motorbike:
              format: double
              type: number
            Motorbikexl:
              format: double
              type: number
            Car:
              format: double
              type: number
            Van:
              format: double
              type: number
    JobCancellation:
      description: Job Cancellation
      type: object
      properties:
        CanceledBy:
          description: Canceled By
          type: string
        ReasonKey:
          description: Reason Key
          type: string
        Comment:
          description: Comment
          type: string
    JobProof:
      description: Job Proof
      type: object
      properties:
        SignatureUrl:
          description: Signature Url
          type: string
    JobEta:
      description: Job Eta
      type: object
      properties:
        Pickup:
          description: Pickup
          type: string
        Dropoff:
          description: Dropoff
          type: string
    RestApiResult_StuartSettings:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/StuartSettings'
          description: Generic data object.
    JobResponse:
      description: Job Response
      type: object
      properties:
        Id:
          format: int32
          description: Id
          type: integer
        CreatedAt:
          format: date-time
          description: Created At
          type:
          - string
          - 'null'
        Status:
          description: Status
          type: string
        PackageType:
          description: Package Type
          type: string
        TransportType:
          description: Transport Type
          type: string
        AssignmentCode:
          description: Assignment Code
          type: string
        PickupAt:
          description: Pickup At
          type: string
        DropoffAt:
          description: Dropoff At
          type: string
        Comment:
          description: Comment
          type: string
        Distance:
          format: double
          description: Distance
          type:
          - number
          - 'null'
        Duration:
          format: int32
          description: Duration
          type:
          - integer
          - 'null'
        Deliveries:
          description: Deliveries
          type: array
          items:
            $ref: '#/components/schemas/JobDelivery'
        Pricing:
          $ref: '#/components/schemas/JobPricing'
          description: Pricing
        Driver:
          $ref: '#/components/schemas/JobDriver'
          description: Driver
    JobContact:
      description: Job Contact
      type: object
      properties:
        Firstname:
          description: Firstname
          type: string
        Lastname:
          description: Lastname
          type: string
        Phone:
          description: Phone
          type: string
        Email:
          description: Email
          type: string
        Company:
          description: Company
          type: string
        CompanyName:
          description: Company Name
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
