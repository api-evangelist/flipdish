components:
  schemas:
    TeammateBase:
      description: ''
      type: object
      properties:
        AppAccessLevel:
          description: App access level
          enum:
          - None
          - Owner
          - StoreOwner
          - PropertyOwner
          - ManagedOwner
          - Integrator
          - PropertyManager
          - StoreManager
          - StoreStaff
          - StaffMember
          - StoreReadOnlyAccess
          - FinanceManger
          - Onboarding
          - Support
          type: string
        HasAccessToAllStores:
          description: The user has access to all stores for the app (including new stores that added later)
          type: boolean
        StoreIds:
          description: Store IDs the user has access to (if HasAccessToAllStores is false)
          type: array
          items:
            format: int32
            type: integer
        PropertyIds:
          description: Property Ids the user has access to (if HasAccessToAllStores is false)
          type: array
          items:
            type: string
    RestApiArrayResult_RedeemInvitationResult:
