components:
  schemas:
    IndexPage:
      description: Index Page
      type: object
      properties:
        Testimonials:
          description: Testimonials
          type: array
          items:
            $ref: '#/components/schemas/WebsiteTestimonial'
        Images:
          description: Images
          type: array
          items:
            $ref: '#/components/schemas/WebsiteImage'
        AboutSectionEnabled:
          description: About section enabled
          type: boolean
        AboutSectionTitle:
          description: About section title
          type: string
        AboutSectionSubtitle:
          description: About section sub-title
          type: string
        AboutSectionLeftTitle:
          description: About section title left
          type: string
        AboutSectionLeftBody:
          description: About section text left
          type: string
        AboutSectionRightTitle:
          description: About section title right
          type: string
        AboutSectionRightBody:
          description: About section text right
          type: string
        OpeningHoursEnabled:
          description: Opening hours section Enabled
          type: boolean
        MenuPreviewEnabled:
          description: Menu Preview section Enabled
          type: boolean
        GalleryEnabled:
          description: Gallery section enabled
          type: boolean
        TestimonialsEnabled:
          description: Testimonials section Enabled
          type: boolean
        ContactFormEnabled:
          description: Contact Form section Enabled
          type: boolean
        ContactFormEmail:
          description: Contact Form Email
          type: string
        MapEnabled:
          description: Map section Enabled
          type: boolean
    RestApiResult_IndexPage:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/IndexPage'
          description: Generic data object.
    WebsiteTestimonialBase:
      description: Represents a testimonial base
      type: object
      properties:
        Author:
          description: Author of the testimonial
          type: string
        Message:
          description: Message of the testimonial
          type: string
    RestApiResult_WebsiteImage:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/WebsiteImage'
          description: Generic data object.
    WebsiteImage:
      description: Represents a website image
      type: object
      properties:
        ImageId:
          format: int32
          description: Represents the id of the image
          type: integer
        ImageLocation:
          description: Represents the location of the image
          enum:
          - IndexHeader
          - IndexAboutSectionLeft
          - IndexAboutSectionRight
          - IndexGallery
          - IndexOpeningHoursHeader
          - IndexTestimonialsHeader
          type: string
        ImageUrl:
          description: Represents the image url
          type: string
    RestApiResult_WebsiteTestimonial:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/WebsiteTestimonial'
          description: Generic data object.
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    IndexPageBase:
      description: Base of Index Page
      type: object
      properties:
        AboutSectionEnabled:
          description: About section enabled
          type: boolean
        AboutSectionTitle:
          description: About section title
          type: string
        AboutSectionSubtitle:
          description: About section sub-title
          type: string
        AboutSectionLeftTitle:
          description: About section title left
          type: string
        AboutSectionLeftBody:
          description: About section text left
          type: string
        AboutSectionRightTitle:
          description: About section title right
          type: string
        AboutSectionRightBody:
          description: About section text right
          type: string
        OpeningHoursEnabled:
          description: Opening hours section Enabled
          type: boolean
        MenuPreviewEnabled:
          description: Menu Preview section Enabled
          type: boolean
        GalleryEnabled:
          description: Gallery section enabled
          type: boolean
        TestimonialsEnabled:
          description: Testimonials section Enabled
          type: boolean
        ContactFormEnabled:
          description: Contact Form section Enabled
          type: boolean
        ContactFormEmail:
          description: Contact Form Email
          type: string
        MapEnabled:
          description: Map section Enabled
          type: boolean
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    RestApiResult_IndexPageBase:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/IndexPageBase'
          description: Generic data object.
    WebsiteTestimonial:
      description: Represents a testimonial
      type: object
      properties:
        TestimonialId:
          format: int32
          description: Id of the testimonial
          type: integer
        Author:
          description: Author of the testimonial
          type: string
        Message:
          description: Message of the testimonial
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
x-samples-languages:
- curl
- node
- csharp
- ruby
- javascript
- python
- swift
x-send-defaults: true
x-flipdish-signalr:
- hubName: AnalyticsHub
  events:
  - eventName: analytics.website
    eventType: AnalyticsClientEvent
- hubName: AppHub
  events:
  - eventName: app.created
    eventType: AppCreatedEvent
  - eventName: app.updated
    eventType: AppUpdatedEvent
- hubName: AuthorizationHub
  events: []
- hubName: BankAccountHub
  events:
  - eventName: bankaccount.created
    eventType: BankAccountCreatedEvent
  - eventName: bankaccount.updated
    eventType: BankAccountUpdatedEvent
  - eventName: bankaccount.deleted
    eventType: BankAccountDeletedEvent
- hubName: CampaignHub
  events: []
- hubName: CardReaderHub
  events:
  - eventName: cardreaders.kiosk.bluetooth.initiatepairingmode
    eventType: KioskBluetoothPairingModeEvent
  - eventName: cardreaders.kiosk.bluetooth.unpaired
    eventType: KioskBluetoothTerminalUnpairedEvent
