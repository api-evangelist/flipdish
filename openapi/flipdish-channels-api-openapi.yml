components:
  schemas:
    StoreChannelAssignment:
      description: Represents a store that is assigned to a Sales Channel
      type: object
      properties:
        ChannelId:
          format: int32
          description: Channel ID
          type: integer
        StoreId:
          format: int32
          description: Store ID
          type: integer
        StoreName:
          description: Store Name
          type: string
    RestApiArrayResult_StoreChannelAssignment:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/StoreChannelAssignment'
    Response:
      type: object
      properties:
        Stores:
          type: array
          items:
            $ref: '#/components/schemas/StoreItemHeader'
    AppChannelAssignment:
      description: "Describes a ChannelAssignment which is \nwhen a AppId is assigned to a Sales Channel"
      type: object
      properties:
        ChannelId:
          format: int32
          description: Id of the channel on the assignment
          type: integer
        AppId:
          description: AppId of the assignment
          type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    Channel:
      description: Channel.
      type: object
      properties:
        ChannelId:
          format: int32
          description: Channel Id
          type: integer
        TranslationKey:
          description: Channel TranslationKey
          type: string
        Source:
          description: Channel Source
          enum:
          - Internal
          - External
          type: string
        LogoUri:
          description: Channel Logo URl
          type: string
        Available:
          description: Channel is Available or not
          type: boolean
        MaintainedExternally:
          description: Channel is Maintained Externally or not
          type: boolean
    RestApiResult_AppChannelAssignment:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/AppChannelAssignment'
          description: Generic data object.
    StoreItemHeader:
      type: object
      properties:
        StoreId:
          format: int32
          type: integer
        Name:
          type: string
    RestApiResult_StoreChannelAssignment:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/StoreChannelAssignment'
          description: Generic data object.
    RestApiArrayResult_Channel:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
