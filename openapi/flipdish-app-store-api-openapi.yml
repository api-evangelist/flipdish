openapi: 3.2.0
info:
  version: v1.0
  title: Flipdish Open API v1.0 App Store API
servers:
- url: https://api.flipdish.co
tags:
- name: App Store
paths:
  /api/v1.0/appstore/apps/{appStoreAppId}:
    get:
      tags:
      - App Store
      operationId: GetAppStoreApp
      parameters:
      - name: appStoreAppId
        in: path
        required: true
        schema:
          type: string
      - name: appId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_AppStoreApp'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_AppStoreApp'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_AppStoreApp'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_AppStoreApp'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Authentication has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
      security:
      - oauth2:
        - api
      summary: Get app store app
      x-summary-source: derived
  /api/v1.0/appstore/apps:
    get:
      tags:
      - App Store
      operationId: GetAppStoreApps
      parameters:
      - name: search
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: excludeNotOwned
        in: query
        required: false
        schema:
          type: boolean
      - name: showOnlyVerified
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiPaginationResult_AppStoreAppSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiPaginationResult_AppStoreAppSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiPaginationResult_AppStoreAppSummary'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiPaginationResult_AppStoreAppSummary'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Authentication has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
      security:
      - oauth2:
        - api
      summary: Get app store apps
      x-summary-source: derived
components:
  schemas:
    ValidValue:
      required:
      - Code
      - Name
      type: object
      properties:
        Code:
          type: string
        Name:
          type: string
    AppStoreApp:
      required:
      - Id
      - VerificationStatus
      - OAuthAppId
      - Internal
      - Details
      - ConfigurationType
      - StoreSelectorType
      - PermissionsType
      - Name
      - Description
      - Categories
      - Countries
      type: object
      properties:
        Id:
          type: string
        VerificationStatus:
          enum:
          - Draft
          - Submitted
          - Verified
          type: string
        Logo:
          type: string
        OAuthAppId:
          type: string
        Internal:
          type: boolean
        Details:
          type: string
        ConfigurationType:
          enum:
          - ExternalLink
          - FlipdishHosted
          type: string
        StoreSelectorType:
          enum:
          - None
          - Single
          - Multiple
          type: string
        FieldGroups:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroup'
        SetupInstructions:
          type: string
        ExternalSetupLink:
          type: string
        TeammateAppAccessLevel:
          enum:
          - Owner
          - StoreOwner
          - PropertyOwner
          - ManagedOwner
          - Integrator
          - PropertyManager
          - StoreManager
          - StoreStaff
          - StaffMember
          - StoreReadOnlyAccess
          - FinanceManger
          type: string
        PermissionsType:
          enum:
          - Teammate
          type: string
        Support:
          $ref: '#/components/schemas/AppStoreAppSupportInfo'
        ExternalFunctionActionUrl:
          type: string
        ExternalFunctionSignatureKey:
          type: string
        IsPaid:
          type: boolean
        Name:
          type: string
        Description:
          type: string
        IsEnabled:
          type: boolean
        Categories:
          type: array
          items:
            enum:
            - PointOfSale
            - DeliveryAndLogistics
            - CRM
            - GiftCard
            - Accounting
            - LoyaltyAndMarketing
            - Other
            type: string
        Countries:
          type: array
          items:
            enum:
            - GB
            - IE
            - FR
            - ES
            - PT
            - IT
            - DE
            - PL
            - BE
            - LU
            - NL
            - US
            - CA
            - BG
            - MX
            - AU
            - NZ
            type: string
        DeveloperName:
          type: string
    RestApiResult_AppStoreApp:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/AppStoreApp'
          description: Generic data object.
    RestApiPaginationResult_AppStoreAppSummary:
      description: Rest api pagination result
      required:
      - Page
      - Limit
      - TotalRecordCount
      - Data
      type: object
      properties:
        Page:
          format: int32
          description: Current page index
          type: integer
        Limit:
          format: int32
          description: Current page size
          type: integer
        TotalRecordCount:
          format: int32
          description: Total record count
          type: integer
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/AppStoreAppSummary'
    AppStoreAppSummary:
      required:
      - Id
      - VerificationStatus
      - Internal
      - Name
      - Description
      - Categories
      - Countries
      type: object
      properties:
        Id:
          type: string
        VerificationStatus:
          enum:
          - Draft
          - Submitted
          - Verified
          type: string
        Logo:
          type: string
        Internal:
          type: boolean
        Name:
          type: string
        Description:
          type: string
        IsEnabled:
          type: boolean
        Categories:
          type: array
          items:
            enum:
            - PointOfSale
            - DeliveryAndLogistics
            - CRM
            - GiftCard
            - Accounting
            - LoyaltyAndMarketing
            - Other
            type: string
        Countries:
          type: array
          items:
            enum:
            - GB
            - IE
            - FR
            - ES
            - PT
            - IT
            - DE
            - PL
            - BE
            - LU
            - NL
            - US
            - CA
            - BG
            - MX
            - AU
            - NZ
            type: string
        DeveloperName:
          type: string
    Field:
      required:
      - Name
      - Description
      - Key
      - Position
      - FieldType
      type: object
      properties:
        Name:
          type: string
        Description:
          type: string
        Key:
          type: string
        Tooltip:
          type: string
        Position:
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        DefaultValue:
          type: string
        ValidValues:
          type: array
          items:
            $ref: '#/components/schemas/ValidValue'
        ValidationRegex:
          type: string
        FieldType:
          enum:
          - Text
          - TextArea
          - Integer
          - Decimal
          - Date
          - DateTime
          - Time
          - Select
          - Boolean
          - ActionButton
          type: string
        IsFlipdishRestricted:
          type:
          - boolean
          - 'null'
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    FieldGroup:
      required:
      - Name
      - Position
      type: object
      properties:
        Name:
          type: string
        Description:
          type: string
        Tooltip:
          type: string
        Position:
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        Fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
    AppStoreAppSupportInfo:
      type: object
      properties:
        PrivacyPolicy:
          type: string
        TermsOfUse:
          type: string
        CompanyWebsite:
          type: string
        LearnMore:
          type: string
        InstallationMessage:
          type: string
        SupportEmail:
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
x-samples-languages:
- curl
- node
- csharp
- ruby
- javascript
- python
- swift
x-send-defaults: true
