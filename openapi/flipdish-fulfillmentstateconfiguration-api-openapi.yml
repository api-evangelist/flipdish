components:
  schemas:
    RestApiResult_FulfillmentStatesConfiguration:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/FulfillmentStatesConfiguration'
          description: Generic data object.
    UpdateFulfillmentStatesConfiguration:
      description: Update fulfillment states configuration
      type: object
      properties:
        OverwriteSystemTemplate:
          description: Set to true if a system configuration template is to be updated (permissions also needed)
          type:
          - boolean
          - 'null'
        StoreIds:
          description: Stores id's
          type: array
          items:
            format: int32
            type: integer
        StoreSelectorType:
          description: Store Selector Type
          enum:
          - None
          - Single
          - Multiple
          type: string
        States:
          description: Settings
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentStatusConfigurationItem'
        AutomaticTransitionsEnabled:
          description: Enable automatic transitions
          type:
          - boolean
          - 'null'
        Name:
          description: Name
          type: string
    FulfillmentStatesConfiguration:
      description: Fulfillment States Configuration
      type: object
      properties:
        States:
          description: States
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentStatusConfigurationItem'
        AutomaticTransitionsEnabled:
          description: Enable automatic transitions
          type:
          - boolean
          - 'null'
        AppId:
          description: AppId
          type: string
        ConfigurationUid:
          description: Configuration Uid
          type: string
        StoreSelectorType:
          description: Store Selector Type
          enum:
          - None
          - Single
          - Multiple
          type: string
        StoreIds:
          description: Store Ids
          type: array
          items:
            format: int32
            type: integer
        Name:
          description: Name
          type: string
    NextStatusWithOrderType:
      description: Next status by order type
      type: object
      properties:
        OrderType:
          description: Order type
          enum:
          - All
          - Delivery
          - Collection
          - DineIn
          type: string
        NextStatus:
          description: Next status id
          type: string
    RestApiArrayResult_FulfillmentStatesConfigurationSummary:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentStatesConfigurationSummary'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    FulfillmentStatusConfigurationItem:
      description: Fulfillment Status Item
      type: object
      properties:
        StatusId:
          description: Status Id (no whitespaces)
          type: string
        StatusName:
          description: Status name
          type: string
        Enabled:
          description: Is status enabled
          type: boolean
        DisplayName:
          description: The short status string that is displayed to users in apps, portal. If empty then Order Status Name is displayed instead
          type: string
        Icon:
          description: Icon/Image that represents that status visual
          type: string
        PublicDescription:
          description: A string which could be used in notification templates with a placeholder (SMS, email, push, web page with status)
          type: string
        Internal:
          description: Is internal state (internal states not shown to customers)
          type: boolean
        NextStatuses:
          description: list of statuses that this status can move to (can be back or forth)
          type: array
          items:
            type: string
        DefaultNextStatus:
          description: The default next status (on a dropdown or quick button on terminal or portal)
          type: array
          items:
            $ref: '#/components/schemas/NextStatusWithOrderType'
        ChangeType:
          description: How will state change (manually or automated, including timed)
          enum:
          - Manual
          - Automated
          - Integrated
          type: string
        IncludeInReports:
          description: Include in reports
          type: boolean
        IsCustom:
          description: Is custom state. If not, then it's a system state
          type: boolean
        OrderTypes:
          description: If empty then applies to all ordertypes, otherwise a list of order types this state applies to
          type: array
          items:
            enum:
            - All
            - Delivery
            - Collection
            - DineIn
            type: string
        Communication:
          description: Whether state should fire off a notification to the customer
          type: boolean
        Image:
          description: Image (image filename, relative, not absolute URL)
          type: string
    FulfillmentStatesConfigurationSummary:
      description: Fulfillment configuration header information
      required:
      - AppId
      type: object
      properties:
        AppId:
          description: AppId
          type: string
        ConfigurationUid:
          description: Configuration Uid
          type: string
        Name:
          description: Name
          type: string
        StoreSelectorType:
          description: Store selector type
          enum:
          - None
          - Single
          - Multiple
          type: string
        Stores:
          description: Stores
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentStatesConfiguredStore'
    CreateFulfillmentStatesConfiguration:
      description: Create fulfillment states configuration
      type: object
      properties:
        StoreIds:
          description: Stores id's
          type: array
          items:
            format: int32
            type: integer
        StoreSelectorType:
          description: Store Selector Type
          enum:
          - None
          - Single
          - Multiple
          type: string
        States:
          description: Settings
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentStatusConfigurationItem'
        AutomaticTransitionsEnabled:
          description: Enable automatic transitions
          type:
          - boolean
          - 'null'
        Name:
          description: Name
          type: string
    FulfillmentStatesConfiguredStore:
      description: Configured stores
      type: object
      properties:
        StoreId:
          format: int32
          description: Store id
          type: integer
        Name:
          description: Name of store
          type: string
    RestApiStringResult:
      description: Rest api string result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Data string
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
x-samples-languages:
- curl
- node
- csharp
- ruby
- javascript
- python
- swift
x-send-defaults: true
x-flipdish-signalr:
- hubName: AnalyticsHub
  events:
  - eventName: analytics.website
    eventType: AnalyticsClientEvent
- hubName: AppHub
  events:
  - eventName: app.created
    eventType: AppCreatedEvent
  - eventName: app.updated
    eventType: AppUpdatedEvent
- hubName: AuthorizationHub
  events: []
- hubName: BankAccountHub
  events:
  - eventName: bankaccount.created
    eventType: BankAccountCreatedEvent
  - eventName: bankaccount.updated
    eventType: BankAccountUpdatedEvent
  - eventName: bankaccount.deleted
    eventType: BankAccountDeletedEvent
- hubName: CampaignHub
  events: []
- hubName: CardReaderHub
  events:
  - eventName: cardreaders.kiosk.bluetooth.initiatepairingmode
    eventType: KioskBluetoothPairingModeEvent
  - eventName: cardreaders.kiosk.bluetooth.unpaired
    eventType: KioskBluetoothTerminalUnpairedEvent
  - eventName: cardreaders.kiosk.bluetooth.updated
    eventType: KioskBluetoothTerminalUpdatedEvent
  - eventName: cardreaders.kiosk.bluetooth.checkforupdates
    eventType: KioskBluetoothTerminalInitiateUpdateCheckEvent
  - eventName: cardreaders.kiosk.bluetooth.initiateinstallupdatemode
    eventType: KioskBluetoothInstallUpdateInitiateEvent
  - eventName: cardreaders.kiosk.bluetooth.cancelupdateinstall
    eventType: KioskBluetoothTerminalCancelUpdateEvent
  - eventName: cardreaders.kiosk.bluetooth.installationstatus
    eventType: KioskBluetoothTerminalInstallationStatusEvent
  - eventName: cardreaders.kiosk.bluetooth.firmwareupdateversion
