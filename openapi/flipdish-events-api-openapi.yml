components:
  schemas:
    TelephonyConfig:
      description: Phone call
      type: object
      properties:
        TelephonyConfigId:
          format: int32
          description: ID of the phone call
          type: integer
        ApmEnabled:
          description: APM enabled flag
          type: boolean
        Type:
          description: Type of telephony service
          enum:
          - PreRecorded
          - VoiceAI
          type: string
        ConsentEnabled:
          description: Consent enabled flag
          type: boolean
        PhoneNumber:
          description: APM phone number of the store
          type: string
        SendAppLinkSms:
          description: Send app link SMS flag
          type: boolean
        UseCustomAppLinkSmsMessage:
          description: Use custom app link SMS message flag
          type: boolean
        UseCustomVoiceMessage:
          description: Use custom voice message flag
          type: boolean
        AppLinkSmsMessage:
          description: App link SMS message
          type: string
        ResendApmMessageAfterDays:
          format: int32
          description: Amount of days to resend APM message
          type: integer
    StoreUnarchivedEvent:
      description: Store Unarchived Event
      type: object
      properties:
        EventName:
          description: The event name
          type: string
        StoreId:
          format: int32
          description: Store Id
          type: integer
        StoreGroupId:
          format: int32
          description: Store group Id
          type: integer
          readOnly: true
        User:
          $ref: '#/components/schemas/UserEventInfo'
          description: User which unarchived this store
        Description:
          description: Description
          type: string
        Store:
          $ref: '#/components/schemas/Store'
          description: Unarchived Store
        FlipdishEventId:
          format: uuid
          description: The identitfier of the event
          type: string
          example: 00000000-0000-0000-0000-000000000000
        CreateTime:
          format: date-time
          description: The time of creation of the event
          type: string
        Position:
          format: int32
          description: Position
          type: integer
        AppId:
          description: App id
          type: string
        OrgId:
          description: Org id
          type: string
        IpAddress:
          description: Ip Address
          type: string
        ActivityId:
          description: Activity Id
          type: string
        ActivityType:
          description: Activity Type
          type: string
    CertificateRenewedEvent:
      description: The DNS for the Hostname verified
      type: object
      properties:
        Hostname:
          description: Description
          type: string
        EventName:
          description: The event name
          type: string
        FlipdishEventId:
          format: uuid
          description: The identitfier of the event
          type: string
          example: 00000000-0000-0000-0000-000000000000
        CreateTime:
          format: date-time
          description: The time of creation of the event
          type: string
        Position:
          format: int32
          description: Position
          type: integer
        AppId:
          description: App id
          type: string
        OrgId:
          description: Org id
          type: string
        IpAddress:
          description: Ip Address
          type: string
        ActivityId:
          description: Activity Id
          type: string
        ActivityType:
          description: Activity Type
          type: string
    RetentionCampaign:
      description: Retention campaign
      type: object
      properties:
        CampaignId:
          format: int32
          description: Id of campaign
          type: integer
        Statistics:
          $ref: '#/components/schemas/CampaignStatistics'
          description: Statistics of campaign
        Stores:
          description: Stores this campaign applies to with campaign start time in Utc
          type: array
          items:
            $ref: '#/components/schemas/StoreCampaignStartTime'
        PublicId:
          format: uuid
          description: Permanent reference to the item.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        NotifyCustomerAfterMinutes:
          format: int32
          description: Time in minutes, after which customer will receive retention voucher if he/she does not order
          maximum: 2147483647
          minimum: 1440
          type: integer
        PercentDiscountAmount:
          format: int32
          description: Discount amount in percents
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
        MaxDiscount:
          format: double
          description: Maximum discount for percentage discounts
          minimum: 0
          type:
          - number
          - 'null'
        LumpDiscountAmount:
          format: double
          description: Discount amount in sum of money
          maximum: 2147483647
          minimum: 0
          type:
          - number
          - 'null'
        VoucherValidPeriodDays:
          format: int32
          description: Number of days for which the voucher will be valid.
          maximum: 300
          minimum: 1
          type: integer
        IncludeDeliveryFee:
          description: Discount will include delivery fee
          type: boolean
        AutoApplyResultingVouchers:
          description: Automatically apply resulting vouchers
          type: boolean
        IncludeExistingOrders:
          description: Campaign will apply to existing orders
          type: boolean
        IsEnabled:
          description: Is campaign enabled
          type: boolean
        StoreIds:
          description: Ids of stores this campaign applies to
          type: array
          items:
            format: int32
            type: integer
        AppId:
          description: The app that this campaign belongs to.
          type: string
        ForceDiscount:
          description: Controls whether the voucher generated from this campaign will override discount exclusions
          type: boolean
