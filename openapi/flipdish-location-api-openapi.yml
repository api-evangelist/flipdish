components:
  schemas:
    LocationArea_Location:
      description: 'Representation of a Location i.e: (Table, Hotel Room, Car Park, etc )'
      required:
      - LocationId
      - LocationName
      - DisplayOrder
      type: object
      properties:
        LocationId:
          format: int32
          description: Id of the Location
          type: integer
        LocationName:
          description: Name of the Location
          type: string
        DisplayOrder:
          format: int32
          description: The order that the Location should be displayed on the screen
          type: integer
        ExternalLocationId:
          description: Id of the Location on an external system
          type: string
        IsDeleted:
          description: Shows if the Location is deleted or not
          type: boolean
    CreateLocation:
      description: Input model for creating a Location
      type: object
      properties:
        LocationId:
          format: int32
          description: Location Id
          type: integer
        LocationName:
          description: Descriptive LocationArea name
          type: string
        DisplayOrder:
          format: int32
          description: The order that the Location should be displayed on the screen
          type: integer
        ExternalLocationId:
          description: Id of the Location on an external system
          type: string
    RestApiResult_LocationArea_Location:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/LocationArea_Location'
          description: Generic data object.
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    RestApiArrayResult_LocationArea_Location:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/LocationArea_Location'
    MappedLocation:
      description: Representation of a Location and its External Mapping
      required:
      - LocationId
      - ExternalLocationId
      type: object
      properties:
        LocationId:
          format: int32
          description: Id of the Location
          type: integer
        ExternalLocationId:
          description: Id of the Location on an external system
          type: string
    RestApiResult_MappedLocation:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/MappedLocation'
          description: Generic data object.
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
