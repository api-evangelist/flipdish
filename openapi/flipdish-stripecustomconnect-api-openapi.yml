components:
  schemas:
    BankAccountDetail:
      description: ''
      type: object
      properties:
        Id:
          format: int32
          description: Id of this account
          type: integer
        StoreNames:
          description: Store Names that are attached to this account
          type: array
          items:
            type: string
        AccountState:
          description: Status of Account
          enum:
          - Unverified
          - AwatingVerification
          - Verified
          - Grandfathered
          type: string
        StripeConnectedAccountInfo:
          $ref: '#/components/schemas/StripeConnectedAccountInfo'
          description: Information about the Stripe connected account associated with this bank account (if any)
        BankAddress:
          description: Address lf the bank
          type: string
        BankCountryCode:
          description: CountryCode of the Bank Account
          type: string
        AccountHolderAddress:
          description: Account Holders Address
          type: string
        AccountHolderCountryCode:
          description: Account Holders Country Code
          type: string
        VatNumber:
          description: Account Holders Vat Number
          type: string
        CurrencyCode:
          description: Currency of Account
          enum:
          - EUR
          - USD
          - GBP
          - CAD
          - AUD
          - DJF
          - ZAR
          - ETB
          - AED
          - BHD
          - DZD
          - EGP
          - IQD
          - JOD
          - KWD
          - LBP
          - LYD
          - MAD
          - OMR
          - QAR
          - SAR
          - SYP
          - TND
          - YER
          - CLP
          - INR
          - AZN
          - RUB
          - BYN
          - BGN
          - NGN
          - BDT
          - CNY
          - BAM
          - CZK
          - DKK
          - CHF
          - MVR
          - BTN
          - XCD
          - BZD
          - HKD
          - IDR
          - JMD
          - MYR
          - NZD
          - PHP
          - SGD
          - TTD
          - XDR
          - ARS
          - BOB
          - COP
          - CRC
          - CUP
          - DOP
          - GTQ
          - HNL
          - MXN
          - NIO
          - PAB
          - PEN
          - PYG
          - UYU
          - VEF
          - IRR
          - XOF
          - CDF
          - XAF
          - HTG
          - ILS
          - HRK
          - HUF
          - AMD
          - ISK
          - JPY
          - GEL
          - KZT
          - KHR
          - KRW
          - KGS
          - LAK
          - MKD
          - MNT
          - BND
          - MMK
          - NOK
          - NPR
          - PKR
          - PLN
          - AFN
          - BRL
          - MDL
          - RON
          - RWF
          - SEK
          - LKR
          - SOS
          - ALL
          - RSD
          - KES
          - TJS
          - THB
          - ERN
          - TMT
          - BWP
          - TRY
          - UAH
          - UZS
          - VND
          - MOP
          - TWD
          - BMD
          type: string
        StoreIds:
          description: List of stores to attach to Account
          type: array
          items:
            format: int32
            type: integer
        BankName:
          description: Name of Bank
          type: string
        AccountName:
          description: Name of this account
          type: string
        Iban:
          description: IBAN of this account
          type: string
        Swift:
          description: SWIFT of this bank account
          type: string
        NationalClearingCode:
          description: National Clearing Code (BSB in Australia, Routing Number in USA/Canada, NCC in NZ)
          type: string
        PopulatedAccountFields:
          description: 'A list of one or more populated account fields (field key-value pairs).

            If this list contains at least one item, the Iban, Swift and NationalClearingCode fields will be ignored.'
          type: array
          items:
            $ref: '#/components/schemas/AccountFieldKeyValuePair'
        RejectionReason:
          description: Reason for Rejection
          type: string
        BusinessType:
          description: Business Type
          enum:
          - Individual
          - Company
          - NonProfit
          - GovernmentEntity
