    InvoiceItem:
      description: Invoice Item
      required:
      - Description
      - Quantity
      - UnitAmountExcludingTax
      - Tax
      - Amount
      - Period
      type: object
      properties:
        Description:
          description: Description
          type: string
        Quantity:
          format: int64
          description: Quantity
          type: integer
        UnitAmountExcludingTax:
          format: double
          description: Unit Amount Excluding Tax
          type: number
        Tax:
          format: double
          description: Tax
          type: number
        Amount:
          format: double
          description: Amount
          type: number
        Period:
          $ref: '#/components/schemas/InvoicePeriod'
          description: Period
    UpcomingInvoice:
      description: UpcomingInvoice.
      required:
      - Subtotal
      - AmountDue
      - Tax
      type: object
      properties:
