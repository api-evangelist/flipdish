openapi: 3.2.0
info:
  version: v1.0
  title: Flipdish Open API v1.0 Subscriptions API
servers:
- url: https://api.flipdish.co
tags:
- name: Subscriptions
paths:
  /api/v1.0/{appId}/subscriptions/{subscriptionId}:
    get:
      tags:
      - Subscriptions
      operationId: GetSubscriptionById
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_Subscription'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_Subscription'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_Subscription'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_Subscription'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Authentication has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
      security:
      - oauth2:
        - api
      summary: Get subscription by id
      x-summary-source: derived
  /api/v1.0/{appId}/subscriptions/hasPaymentMethod:
    get:
      tags:
      - Subscriptions
      operationId: HasCustomerGotPaymentMethodOnFile
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      - name: email
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_HasPaymentMethodResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_HasPaymentMethodResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_HasPaymentMethodResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_HasPaymentMethodResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Authentication has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
      security:
      - oauth2:
        - api
      summary: Has customer got payment method on file
      x-summary-source: derived
  /api/v1.0/{appId}/subscriptions:
    get:
      tags:
      - Subscriptions
      operationId: GetSubscriptionsForApp
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      - name: excludeNotOwnedSubscriptions
        in: query
        required: false
        schema:
          type: boolean
      - name: storeId
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: excludeCancelledSubscriptions
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiArrayResult_SubscriptionSummary'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiArrayResult_SubscriptionSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiArrayResult_SubscriptionSummary'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiArrayResult_SubscriptionSummary'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Authentication has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
      security:
      - oauth2:
        - api
      summary: Get subscriptions for app
      x-summary-source: derived
components:
  schemas:
    SubscriptionStore:
      description: Subscription Store
      required:
      - Id
      - Name
      type: object
      properties:
        Id:
          format: int32
          description: Store Id
          type: integer
        Name:
          description: Name
          type: string
    RestApiArrayResult_SubscriptionSummary:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionSummary'
    RestApiResult_Subscription:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/Subscription'
          description: Generic data object.
    RestApiResult_HasPaymentMethodResponse:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/HasPaymentMethodResponse'
          description: Generic data object.
    HasPaymentMethodResponse:
      description: Has Payment Method Response
      required:
      - HasPaymentMethod
      type: object
      properties:
        HasPaymentMethod:
          description: Has Payment Method
          type: boolean
    InvoiceDiscount:
      description: Invoice Discount
      required:
      - Name
      - Amount
      type: object
      properties:
        Name:
          description: Name
          type: string
        Amount:
          format: double
          description: Amount
          type: number
    InvoicePeriod:
      description: Invoice Period
      type: object
      properties:
        Start:
          format: date-time
          description: Start
          type: string
        End:
          format: date-time
          description: End
          type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    Subscription:
      description: Subscription
      required:
      - Products
      - SubscriptionId
      - Name
      - Status
      - Currency
      - User
      type: object
      properties:
        Products:
          description: Products
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionProduct'
        NextInvoiceAmount:
          format: double
          description: Next invoice amount
          type:
          - number
          - 'null'
        NextInvoiceBillingDate:
          format: date-time
          description: Next invoice billing date
          type:
          - string
          - 'null'
        UpcomingInvoiceItems:
          description: Upcoming invoice items
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        UpcomingInvoiceDiscounts:
          description: Upcoming invoice discounts
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDiscount'
        UpcomingInvoice:
          $ref: '#/components/schemas/UpcomingInvoice'
          description: Upcoming invoice
        SubscriptionId:
          description: The subscription identifier
          type: string
        Name:
          description: Name
          type: string
        Status:
          description: Status
          enum:
          - Incomplete
          - IncompleteExpired
          - Trialing
          - Active
          - PastDue
          - Canceled
          - Unpaid
          type: string
