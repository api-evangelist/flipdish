          type:
          - string
          - 'null'
    SubscriptionProduct:
      description: Product
      required:
      - ProductId
      - Name
      - Quantity
      - PaymentFrequency
      type: object
      properties:
        ProductId:
          description: Product Identifier
          type: string
        Name:
          description: Name
          type: string
        Quantity:
          format: int64
          description: Quantity
          type: integer
        PricePerUnit:
          format: double
          description: Price Per Unit
          type:
          - number
          - 'null'
        PriceTotal:
          format: double
          description: Price Total
          type:
          - number
          - 'null'
        PaymentFrequency:
          description: Payment Frequency
          enum:
          - day
          - week
          - month
          - year
          type: string
        Stores:
          description: Stores
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionStore'
    SubscriptionSummary:
      description: Subscription Summary
      required:
