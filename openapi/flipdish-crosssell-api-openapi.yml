                $ref: '#/components/schemas/RestApiResult_CrossSellMenuItems'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_CrossSellMenuItems'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_CrossSellMenuItems'
        '400':
          description: BadRequest
