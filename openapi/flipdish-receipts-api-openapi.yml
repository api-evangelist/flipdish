        DeliveryAmount:
          format: double
          type: number
        DepositReturnFeeAmount:
          format: double
          type: number
        TotalTax:
          format: double
          type: number
        TotalAmount:
          format: double
          type: number
        Items:
          type: array
          items:
            $ref: '#/components/schemas/PreviousOrderItem'
        TaxRates:
          type: array
          items:
            $ref: '#/components/schemas/TaxRate'
        WhiteLabelId:
          format: int32
          type: integer
    DepositReturnFeesSummary:
      type: object
      properties:
        Count:
          format: int32
          type: integer
        Fee:
          format: double
          type: number
        Total:
          format: double
          type: number
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
