openapi: 3.2.0
info:
  version: v1.0
  title: Flipdish Open API v1.0 Receipts API
servers:
- url: https://api.flipdish.co
tags:
- name: Receipts
paths:
  /api/v1.0/receipts/{orderId}:
    get:
      tags:
      - Receipts
      operationId: GetReceipt
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptByOrderIdQueryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetReceiptByOrderIdQueryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetReceiptByOrderIdQueryResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/GetReceiptByOrderIdQueryResponse'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Unauthorized
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
        '404':
          description: NotFound
      security:
      - oauth2:
        - api
      summary: Get receipt
      x-summary-source: derived
components:
  schemas:
    GetReceiptByOrderIdQueryResponse:
      type: object
      properties:
        PreviousOrder:
          $ref: '#/components/schemas/PreviousOrder'
        DepositReturnFeesSummary:
          type: array
          items:
            $ref: '#/components/schemas/DepositReturnFeesSummary'
        TsRequestedForLocal:
          format: date-time
          type: string
        TsOrderPlacedLocal:
          format: date-time
          type: string
        LogoUrl:
          type: string
        Address:
          type: string
        VatNumber:
          type: string
        PaymentMethodDescription:
          type: string
        OrgId:
          type: string
        CountryCode:
          type: string
    PreviousOrderItemOption:
      type: object
      properties:
        Name:
          type: string
        DepositReturnFee:
          format: double
          type: number
    PreviousOrderItem:
      type: object
      properties:
        MenuSectionDisplayOrder:
          format: int32
          type: integer
        MenuSectionName:
          type: string
        Name:
          type: string
        PriceIncludingOptionSetItems:
          format: double
          type: number
        DepositReturnFee:
          format: double
          type: number
        TaxAmount:
          format: double
          type: number
        PreviousOrderItemOptions:
          type: array
          items:
            $ref: '#/components/schemas/PreviousOrderItemOption'
    TaxRate:
      type: object
      properties:
        Name:
          type: string
        Percentage:
          format: double
          type: number
        Total:
          format: double
          type: number
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    PreviousOrder:
      type: object
      properties:
        DeliveryType:
          type: string
        DeliveryLocationAddressString:
          type: string
        PaymentAccountType:
          type: string
        OrderId:
          format: int32
          type: integer
        ReceiptCode:
          type: string
