openapi: 3.2.0
info:
  version: v1.0
  title: Flipdish Open API v1.0 White Label Contact Form Type API
servers:
- url: https://api.flipdish.co
tags:
- name: WhiteLabelContactFormType
paths:
  /api/v1.0/whitelabelconfig/{appId}/contact-form-type:
    get:
      tags:
      - WhiteLabelContactFormType
      operationId: GetAppContactFormType
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
      security:
      - oauth2:
        - api
      summary: Get app contact form type
      x-summary-source: derived
    post:
      tags:
      - WhiteLabelContactFormType
      operationId: UpdateAppContactFormType
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiResult_ContactFormTypeConfigModel'
        '400':
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiUnauthorizedResult'
        '403':
          description: Successful authentication, but authorization has been denied for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiForbiddenResult'
        '404':
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/RestApiErrorResult'
      security:
      - oauth2:
        - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormTypeConfigModel'
          text/json:
            schema:
              $ref: '#/components/schemas/ContactFormTypeConfigModel'
          application/xml:
            schema:
              $ref: '#/components/schemas/ContactFormTypeConfigModel'
          text/xml:
            schema:
              $ref: '#/components/schemas/ContactFormTypeConfigModel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactFormTypeConfigModel'
        required: true
      summary: Update app contact form type
      x-summary-source: derived
components:
  schemas:
    ContactFormTypeConfigModel:
      description: App contact form type configuration model
      type: object
      properties:
        ContactFormType:
          description: 'Contact form type.

            Named values: None = 0, Email = 1, Intercom = 2, WebView = 3, FlipdishMessages = 4.

            Values without a name (such as 5 for Phone and 6 for Email and phone) are accepted as their numeric string

            and are returned the same way, for example "5".'
          type: string
    RestApiResult_ContactFormTypeConfigModel:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/ContactFormTypeConfigModel'
          description: Generic data object.
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
