components:
  schemas:
    MetafieldDefinitionRecommendation:
      description: OwnerEntity Metafield Definition Recommendation
      required:
      - Key
      - Name
      type: object
      properties:
        OwnerEntity:
          description: The Metafield will extend the specified {Flipdish.Metafields.PublicModels.V1.MetafieldDefinitionBase.OwnerEntity}
          enum:
          - CatalogItem
          - CatalogGroup
          - Menu
          type: string
        Key:
          description: 'Key of the metafield.

            The key must have two parts, separated by a dot. The first part acts as a category, for organizational purposes.

            The parts can be composed of lowercase letters, numbers, hyphen and underscore'
          type: string
        ValueType:
          description: The excepted type for the Value field
          enum:
          - Boolean
          - Json
          - SingleLineString
          - MultiLineString
          type: string
        Name:
          description: Field Name
          type: string
        Description:
          description: Field Description
          type: string
        Behaviors:
          description: Enable Metafield Behaviors
          type: array
          items:
            enum:
            - SendToOrder
            - SendToMenu
            type: string
        MetafieldDefinitionRecommendationId:
          format: int32
          description: Metafield Recommendation Id
          type:
          - integer
          - 'null'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    MetafieldDefinition:
      description: Metafield Definition
      required:
      - Key
      - Name
      type: object
      properties:
        IsReadOnly:
          description: Indicates if a definition can be edited or not
          type: boolean
        OwnerEntity:
          description: The Metafield will extend the specified {Flipdish.Metafields.PublicModels.V1.MetafieldDefinitionBase.OwnerEntity}
