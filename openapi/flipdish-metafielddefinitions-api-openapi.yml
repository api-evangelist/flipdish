        Name:
          description: Field Name
          type: string
        Description:
          description: Field Description
          type: string
        Behaviors:
          description: Enable Metafield Behaviors
          type: array
          items:
            enum:
            - SendToOrder
            - SendToMenu
            type: string
        MetafieldDefinitionRecommendationId:
          format: int32
          description: Metafield Recommendation Id
          type:
          - integer
          - 'null'
    OwnerEntityConfigurations:
      description: Owner Entity Configurations
      type: object
      properties:
        Configurations:
          description: Owner Entity Configuration
          type: array
          items:
            $ref: '#/components/schemas/OwnerEntityConfiguration'
    RestApiPaginationResult_MetafieldDefinitionRecommendation:
      description: Rest api pagination result
      required:
      - Page
      - Limit
      - TotalRecordCount
      - Data
      type: object
      properties:
        Page:
          format: int32
          description: Current page index
          type: integer
        Limit:
          format: int32
