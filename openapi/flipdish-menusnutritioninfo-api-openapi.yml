components:
  schemas:
    NutritionInfoItemAddUpdateLabelModel:
      description: NutritionInfoItemAddUpdateLabelModel.
      type: object
      properties:
        Name:
          description: Name.
          type: string
        Values:
          description: Values.
          type: array
          items:
            type: string
        IconUrl:
          description: IconUrl.
          type: string
    NutritionInfoMenuItem:
      description: NutritionInfoMenuItem.
      type: object
      properties:
        PublicId:
          format: uuid
          description: Menu item public id
          type: string
          example: 00000000-0000-0000-0000-000000000000
        Labels:
          description: List of Nutrition Info Labels for this menu item
          type: array
          items:
            $ref: '#/components/schemas/NutritionInfoLabel'
    Allergen:
      description: Allergen.
      type: object
      properties:
        AllergenId:
          description: A unique identifier for the allergen
          type: string
        LocalizedName:
          description: Localized name of the allergen
          type: string
        IconUrl:
          description: Url to the icon for the allergen
          type: string
    MenuNutritionInfoHeader:
      description: MenuNutritionInfoHeader.
      type: object
      properties:
        MenuId:
          format: int32
          description: Menu Id
          type: integer
        NutritionInfoVersionGuid:
          format: uuid
          description: Nutrition information version guid (generated every time the nutrition information is updated)
          type: string
          example: 00000000-0000-0000-0000-000000000000
        AbsoluteUrl:
          description: Absolute URL of the nutrition information json file
          type: string
    RestApiArrayResult_Allergen:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/Allergen'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    RestApiResult_NutritionInfo:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/NutritionInfo'
          description: Generic data object.
    ItemNutritionInfoAddUpdateModel:
      description: ItemNutritionInfoAddUpdateModel.
      type: object
      properties:
        Labels:
          description: Labels.
          type: array
          items:
            $ref: '#/components/schemas/NutritionInfoItemAddUpdateLabelModel'
    NutritionInfo:
      description: Menu Nutrition Information
      type: object
      properties:
        Version:
          description: Version of the nutrition information model
          maxLength: 30
          minLength: 0
          type: string
        MenuItems:
          description: List of menu item nutrition infos
          type: array
          items:
            $ref: '#/components/schemas/NutritionInfoMenuItem'
        MenuItemOptionSetItems:
          description: List of menu item option set nutrition infos
          type: array
          items:
            $ref: '#/components/schemas/NutritionInfoMenuOptionSetItem'
    NutritionInfoMenuOptionSetItem:
      description: NutritionInfoMenuOptionSetItem.
      type: object
      properties:
        PublicId:
          format: uuid
          description: Menu item option set item public id
          type: string
          example: 00000000-0000-0000-0000-000000000000
        Labels:
          description: List of Nutrition Info Labels for this menu item option set item
          type: array
          items:
            $ref: '#/components/schemas/NutritionInfoLabel'
    RestApiResult_MenuNutritionInfoHeader:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/MenuNutritionInfoHeader'
          description: Generic data object.
    NutritionInfoLabel:
      description: NutritionInfoLabel.
      type: object
      properties:
        Name:
          description: Name of the allergen / ingredient
          type: string
        Values:
          description: Optional list of values for the allergen / ingredient
          type: array
          items:
            type: string
        IconUrl:
          description: Url to the icon for the allergen / ingredient
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
