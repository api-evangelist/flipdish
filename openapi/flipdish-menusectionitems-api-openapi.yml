components:
  schemas:
    RestApiResult_CreatedMenuSectionItems:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/CreatedMenuSectionItems'
          description: Generic data object.
    CreateMenuSectionItemFromCatalogItems:
      description: Add CatalogItems to a Menu
      required:
      - MenuCatalogItems
      type: object
      properties:
        MenuCatalogItems:
          description: List of CatalogItems to add to the section
          type: array
          items:
            $ref: '#/components/schemas/MenuCatalogItem'
    MenuItemOptionSet:
      description: Menu item option set
      type: object
      properties:
        MenuItemOptionSetId:
          format: int32
          description: Menu item option set identifier
          type: integer
        ImageName:
          description: Image Name
          type: string
        ImageUrl:
          description: Image url
          type: string
        MenuItemOptionSetItems:
          description: Option set items
          type: array
          items:
            $ref: '#/components/schemas/MenuItemOptionSetItem'
        PublicId:
          format: uuid
          description: Permanent reference to the item.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        CatalogItemId:
          description: Catalog item Id when the OptionSet is associated to a Product
          type: string
        Name:
          description: Menu item option set name
          maxLength: 4000
          minLength: 0
          type: string
        IsMasterOptionSet:
          description: Is master option set. This can affect the layout of the options in the menu displayed to the customer. Usually it is true if the option could be considerd a standalone item as opposed to an addition ("with ketchup") or modifier ("large").
          type: boolean
        DisplayOrder:
          format: int32
          description: Display order. Displayed in ascending order.
          type: integer
        MinSelectCount:
          format: int32
          description: Minimum items must be selected
          type: integer
        MaxSelectCount:
          format: int32
          description: Maximum number of items can be selected
          type: integer
        CellLayoutType:
          description: 'Small | Medium | Large

            Affects the layout of the menu.'
          enum:
          - Small
          - Medium
          - Large
          - HiddenImage
          type: string
    RestApiArrayResult_MenuSectionItem:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/MenuSectionItem'
    MenuItemOptionSetItem:
      description: Menu item option set item
      type: object
      properties:
        MenuItemOptionSetItemId:
          format: int32
          description: Menu item option set item identifier
          type: integer
        PublicId:
          format: uuid
          description: Permanent reference to the item.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        Metadata:
          description: List of metadata
          type: array
          items:
            $ref: '#/components/schemas/CreateMetadata'
        NextMenuItemOptionSetId:
          format: int32
          description: if null, next option set is next. if -1, this is the final option set
          type:
          - integer
          - 'null'
        CatalogItemId:
          description: Catalog item Id when the OptionSet is associated to a Product
          type: string
        TaxRateName:
          description: Tax rate name
          type: string
        TaxRateId:
          format: int32
          description: TaxRateId.
          type:
          - integer
          - 'null'
        TaxValue:
          format: double
          description: TaxValue.
          type: number
        Name:
          description: Name
          type: string
        Price:
          format: double
          description: Price
          type: number
        DepositReturnFee:
          format: double
          description: An optional fee that can be added to the price of the item.
          type:
          - number
          - 'null'
        IsAvailable:
          description: Is available
          type: boolean
        DisplayOrder:
          format: int32
          description: Display order. Displayed in ascending order.
          type: integer
        CellLayoutType:
          description: 'Small | Medium | Large

            Affects the layout of the menu.'
          enum:
          - Small
          - Medium
          - Large
          - HiddenImage
          type: string
        ImageUrl:
          description: Image url
          type: string
    MenuSectionItemBase:
      description: Menu item
      type: object
      properties:
        Name:
          description: Menu item name (like "Korma")
          maxLength: 4000
          minLength: 0
          type: string
        Description:
          description: Description (like "A lovely dish from the east")
          maxLength: 4000
          minLength: 0
          type: string
        SpicinessRating:
          description: Spiciness rating
          enum:
          - NotRated
          - Mild
          - Medium
          - Hot
          type: string
        Price:
          format: double
          description: Price - this is only used when there is no master option set and should be set to 0 if a master option set exists.
          type: number
        DepositReturnFee:
          format: double
          description: An optional fee that can be added to the price of the item.
          type:
          - number
          - 'null'
        DisplayOrder:
          format: int32
          description: Display order
          type: integer
        Alcohol:
          description: To be set true if the item or an option of the item contains an alcoholic drink.
          type: boolean
        IsAvailable:
          description: True if we accept orders for this item still
          type: boolean
        CellLayoutType:
          description: 'Small | Medium | Large

            Affects the layout of the menu.'
          enum:
          - Small
          - Medium
          - Large
          - HiddenImage
          type: string
        DisableVouchers:
          description: If true, then vouchers won't be applied for this item
          type: boolean
        ImageName:
          description: Image url
          type: string
        ImageUrl:
          description: Image url
          type: string
        MenuItemId:
          format: int32
          description: Menu Item Id
          type: integer
        ExcludeFromVoucherDiscounting:
          description: If true, the item is excluded from voucher discount calculations
          type: boolean
        PublicId:
          format: uuid
          description: Permanent reference to the item.
          type: string
          example: 00000000-0000-0000-0000-000000000000
    CreatedMenuSectionItems:
      description: Response for the creation of multiple Menu Section Items
      type: object
      properties:
        MenuSectionItems:
          description: Created Menu Section Items
          type: array
          items:
            $ref: '#/components/schemas/MenuSectionItem'
    RestApiResult_MenuSectionItem:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/MenuSectionItem'
          description: Generic data object.
    CreateMetadata:
      description: Create metadata
      type: object
      properties:
        StoreId:
          format: int32
          description: Store identifier
          type: integer
        Key:
          description: Metadata key (Unique identifier)
          maxLength: 128
          minLength: 0
          type: string
        Value:
          description: Metadata value
          maxLength: 4000
          minLength: 0
          type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    Range:
      description: 'A class that represents a single opening period in a day.

        This starts ''StartTime'' after midnight and runs for a ''Period''

        after that, on the given DayOfWeek.'
      type: object
      properties:
        StartTime:
          description: Start time
          type: string
        Period:
          description: Period
          type: string
        DayOfWeek:
          description: Day of week
          enum:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          type: string
    MenuSectionItem:
      description: Menu item
      type: object
      properties:
        ActualPrice:
          format: double
          description: Actual price - the minimum price possible when all required option set items prices are included.
          type: number
        MenuItemOptionSets:
          description: Menu item option sets
          type: array
          items:
            $ref: '#/components/schemas/MenuItemOptionSet'
        DailySpecialHours:
          description: Daily special hours
          type: array
          items:
            $ref: '#/components/schemas/BusinessHoursPeriod'
        PublicId:
          format: uuid
          description: Permanent reference to the item.
          type: string
          example: 00000000-0000-0000-0000-000000000000
        TaxRateName:
          description: Tax rate name
          type: string
        TaxRateId:
          format: int32
          description: TaxRate
          type:
          - integer
          - 'null'
        TaxValue:
          format: double
          description: TaxValue - the tax associated with this item, based on TaxRate / TaxType and Currency (currency determines decimal point precision)
          type: number
        ExcludeFromVoucherDiscounting:
          description: If true, the item is excluded from voucher discount calculations
          type: boolean
        Metadata:
          description: List of metadata
          type: array
          items:
            $ref: '#/components/schemas/CreateMetadata'
        CatalogItemId:
          description: Catalog item Id when the Item is associated to a Product
          type: string
        Name:
          description: Menu item name (like "Korma")
          maxLength: 4000
          minLength: 0
          type: string
        Description:
          description: Description (like "A lovely dish from the east")
          maxLength: 4000
          minLength: 0
          type: string
        SpicinessRating:
          description: Spiciness rating
          enum:
          - NotRated
          - Mild
          - Medium
          - Hot
          type: string
        Price:
          format: double
          description: Price - this is only used when there is no master option set and should be set to 0 if a master option set exists.
          type: number
        DepositReturnFee:
          format: double
          description: An optional fee that can be added to the price of the item.
          type:
          - number
          - 'null'
        DisplayOrder:
          format: int32
          description: Display order
          type: integer
        Alcohol:
          description: To be set true if the item or an option of the item contains an alcoholic drink.
          type: boolean
        IsAvailable:
          description: True if we accept orders for this item still
          type: boolean
        CellLayoutType:
          description: 'Small | Medium | Large

            Affects the layout of the menu.'
          enum:
          - Small
          - Medium
          - Large
          - HiddenImage
          type: string
        DisableVouchers:
          description: If true, then vouchers won't be applied for this item
          type: boolean
        ImageName:
          description: Image url
          type: string
        ImageUrl:
          description: Image url
          type: string
        MenuItemId:
          format: int32
          description: Menu Item Id
          type: integer
    MenuCatalogItem:
      description: Information to add a CatalogItem to a Menu
      required:
      - CatalogItemId
      type: object
      properties:
        CatalogItemId:
          description: Product Id to the product to add as Menu Item
          maxLength: 30
          minLength: 0
          type: string
        CellLayoutType:
          description: 'Small | Medium | Large | HiddenImage

            Affects the layout of the menu.'
          enum:
          - Small
          - Medium
          - Large
          - HiddenImage
          type: string
    BusinessHoursPeriod:
      description: Business hours period
      type: object
      properties:
        Early:
          $ref: '#/components/schemas/Range'
          description: Early
        Late:
          $ref: '#/components/schemas/Range'
          description: Late
        Ranges:
          description: Ranges
          type: array
          items:
            $ref: '#/components/schemas/Range'
        DayOfWeek:
          description: Day of week
          enum:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          type: string
        StartTime:
          description: Start time
          type: string
        Period:
          description: Period
          type: string
        StartTimeEarly:
          description: Start time early
          type: string
        PeriodEarly:
          description: Period early
          type: string
    RestApiStringResult:
      description: Rest api string result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Data string
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            api: Access to Flipdish API
          authorizationUrl: https://api.flipdish.co/identity/connect/authorize
      description: OAuth2 Implicit Grant
