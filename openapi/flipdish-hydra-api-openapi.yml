components:
  schemas:
    HydraStatus:
      description: Hydra status
      required:
      - AppId
      - IsRegistered
      type: object
      properties:
        AppId:
          description: ''
          type: string
        StoreIds:
          description: Store to assign the hydra
          type: array
          items:
            format: int32
            type: integer
        PropertyIds:
          description: AuthZ Property ids for assigned stores
          type: array
          items:
            type: string
        IsRegistered:
          description: The device has been already registered
          type: boolean
        PinCode:
          format: int32
          description: 6 digit PIN code (not starting with zero).
          maximum: 999999
          minimum: 100000
          type:
          - integer
          - 'null'
        Images:
          description: Hydra images (covers)
          type: array
          items:
            type: string
        UserType:
          description: Hydra User Type as integer. Prefer {Flipdish.PublicModels.V1.Hydra.HydraStatus.DeviceType}.
          enum:
          - Kiosk
          - Terminal
          - LegacyPrinter
          type: string
        DeviceType:
          description: Hydra device type (Kiosk / Terminal), serialized as string.
          enum:
          - Kiosk
          - Terminal
          - LegacyPrinter
          type: string
        HydraUserId:
          format: int32
          description: Zeus Hydra user id
          type: integer
    RestApiPaginationResult_HydraDeviceDetails:
      description: Rest api pagination result
      required:
      - Page
      - Limit
      - TotalRecordCount
      - Data
      type: object
      properties:
        Page:
          format: int32
          description: Current page index
          type: integer
        Limit:
          format: int32
          description: Current page size
          type: integer
        TotalRecordCount:
          format: int32
          description: Total record count
          type: integer
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/HydraDeviceDetails'
    RestApiErrorResult:
      description: Rest api error result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Error message
          type: string
        ErrorCode:
          format: int32
          description: Error code
          type: integer
        StackTrace:
          description: Stack trace
          type: string
        Errors:
          description: List of errors grouped by field name
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorResult'
    HydraRegistrationRequest:
      description: Hydra registration result
      required:
      - StoreIds
      - DeviceName
      type: object
      properties:
        StoreIds:
          description: Stores to assign the hydra
          type: array
          items:
            format: int32
            type: integer
        DeviceName:
          description: Hydra device name
          type: string
        PinCode:
          format: int32
          description: 6 digit PIN code (not starting with zero).
          maximum: 999999
          minimum: 100000
          type: integer
    DeviceSettings:
      description: Device settings for Hydra
      required:
      - Volume
      - FontSize
      - Brightness
      type: object
      properties:
        Volume:
          format: int32
          description: Gets or sets the device volume
          maximum: 10
          minimum: 0
          type: integer
        FontSize:
          format: double
          description: Gets or sets the font size used on the device
          maximum: 100
          minimum: 1
          type: number
        Brightness:
          format: int32
          description: Gets or sets the display brightness on the device
          maximum: 100
          minimum: 0
          type: integer
    HydraStoreData:
      description: Store Data
      type: object
      properties:
        StoreId:
          format: int32
          description: Id of the store
          type: integer
        StoreName:
          description: Name of the store
          type: string
    HydraConfig:
      description: Hydra configuration
      required:
      - MinimumVersion
      - PaymentOptions
      - DeviceSettings
      type: object
      properties:
        MinimumVersion:
          description: Minimum version
          type: string
        PaymentOptions:
          description: Payment options
          type: array
          items:
            enum:
            - Online
            - Emv
            - Counter
            type: string
        DeviceSettings:
          $ref: '#/components/schemas/DeviceSettings'
          description: Device settings
        Version:
          description: Version of the device
          type: string
        BuildNumber:
          description: Build number of the device
          type: string
        GitSha:
          description: SHA of the commit
          type: string
        GitBranch:
          description: Build branch
          type: string
    RestApiArrayResult_EmvTerminalWithAssignments:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/EmvTerminalWithAssignments'
    HydraDeviceDetails:
      description: Hydra device details
      type: object
      properties:
        HydraConfigId:
          format: int32
          description: Flipdish internal device identifier
          type: integer
        DeviceId:
          description: Device Id
          type: string
        SerialNumber:
          description: Serial Number
          type: string
        DeviceType:
          description: Type of the device
          enum:
          - Kiosk
          - Terminal
          - LegacyPrinter
          type: string
        Status:
          description: Status of the device
          enum:
          - Online
          - PossiblyOffline
          - Offline
          type: string
        DeviceName:
          description: Device Name
          type: string
        StoreNames:
          description: Store Names
          type: array
          items:
            $ref: '#/components/schemas/HydraStoreData'
        LastPollUtc:
          format: date-time
          description: Last poll time in UTC
          type:
          - string
          - 'null'
        Version:
          description: Version of the device
          type: string
        BuildNumber:
          description: Build number of the device
          type: string
        GitSha:
          description: SHA of the commit
          type: string
        GitBranch:
          description: Build branch
          type: string
    RestApiResult_HydraStatus:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/HydraStatus'
          description: Generic data object.
    KioskCashPaymentSettings:
      description: Get Cash Payment Settings for a UserId
      type: object
      properties:
        IsCashVisibleToCustomer:
          description: 'false :disable cash on kiosk

            true :enable cash on kiosk'
          type: boolean
        UserId:
          format: int32
          description: HydraUser ID of the Device
          type: integer
    KioskSettings:
      description: Kiosk level settings
      type: object
      properties:
        HideLogoFromFrontPage:
          description: Hide logo from front page
          type: boolean
        TwoColumnMenuLayout:
          description: 2 Column Menu Layout
          type: boolean
    RestApiResult_PaymentTerminalTransactionDetails:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/PaymentTerminalTransactionDetails'
          description: Generic data object.
    RestApiResult_PaymentTerminalDetails:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/PaymentTerminalDetails'
          description: Generic data object.
    PaymentTerminalTransactionDetails:
      description: Details of Payment Terminal Transaction
      type: object
      properties:
        CardSchemeName:
          description: Card Type
          type: string
        DateOfExpiry:
          description: Expirey Date on Card
          type: string
        AuthCode:
          description: AuthCode
          type: string
        TransactionResult:
          description: State of Request, "PENDING" is not yet completed
          type: string
        PrimaryAccountNumber:
          description: Masked PAN
          type: string
        CardholderVerificationMethod:
          description: Type of Verification.
          type: string
    RestApiResult_KioskSettings:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/KioskSettings'
          description: Generic data object.
    ValidationErrorResult:
      description: Validation error result
      type: object
      properties:
        FieldName:
          description: Field name
          type: string
        Errors:
          description: List of errors relates to field
          type: array
          items:
            type: string
    RestApiUnauthorizedResult:
      description: Rest api unauthorized result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
    EmvTerminal:
      description: EMV Payment Terminal
      type: object
      properties:
        EmvTerminalId:
          format: int32
          description: Flipdish Identifier of Terminal
          type: integer
        TerminalId:
          description: External Identifier of Terminal
          type: string
        Url:
          description: URL at which terminal can be accessed
          type: string
        Token:
          description: TOKEN required to access terminal
          type: string
        SoftwareHouseId:
          description: Identifies us to Provider
          type: string
        InstallerId:
          description: Identifies installer of terminal
          type: string
    EmvTerminalWithAssignments:
      description: EMV Payment Terminal
      type: object
      properties:
        EmvTerminalId:
          description: Flipdish Internal identifier of the Terminal
          type: string
        TerminalId:
          description: External Identifier of the Terminal
          type: string
        IsAssignedToHydraDevice:
          description: true if the terminal is assigned to a hydra device (e.g. a kiosk)
          type: boolean
        HydraConfigId:
          format: int32
          description: hydra device id (null if the terminal is not assigned to any hydra device)
          type:
          - integer
          - 'null'
        HydraDeviceId:
          description: external hydra device id (null if the terminal is not assigned to any hydra device)
          type: string
        HydraName:
          description: hydra device name (null if the terminal is not assigned to any hydra device)
          type: string
    RestApiResult_HydraConfig:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/HydraConfig'
          description: Generic data object.
    RestApiResult_HydraDeviceDetails:
      description: Rest api result
      required:
      - Data
      type: object
      properties:
        Data:
          $ref: '#/components/schemas/HydraDeviceDetails'
          description: Generic data object.
    RestApiArrayResult_KioskCashPaymentSettings:
      description: Rest api array result
      required:
      - Data
      type: object
      properties:
        Data:
          description: Generic data object.
          type: array
          items:
            $ref: '#/components/schemas/KioskCashPaymentSettings'
    PaymentTerminalDetails:
      description: Details of Payment Terminal
      type: object
      properties:
        TerminalId:
          description: Terminal Id (tid)
          type: string
        Status:
          description: Status of Terminal
          type: string
        Currency:
          description: Currency configured on the terminal
          type: string
        Uri:
          description: Location to Device
          type: string
    RestApiForbiddenResult:
      description: Rest Api Forbidden Result
      required:
      - Message
      type: object
      properties:
        Message:
          description: Message
          type: string
          readOnly: true
